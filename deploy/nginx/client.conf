server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM fingerprinted bundles are immutable.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Runtime config must never be cached (per-environment API base).
    location = /pm-config.json {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: every unknown route serves index.html so Blazor's
    # client-side router owns the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression for the WASM payload.
    gzip on;
    gzip_types application/wasm application/javascript text/css application/json;
    gzip_min_length 1024;
}
